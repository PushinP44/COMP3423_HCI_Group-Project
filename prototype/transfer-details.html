<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transfer — Feature 2: Simplified Transfer Flow (Step 1 of 2)</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a href="#main" class="skip-link">Skip to main content</a>
<div class="phone-frame">
  <div class="status-bar"><span>9:41</span><span>●●●●  Wi-Fi  100%</span></div>

  <header class="app-header">
    <a class="back-link" href="home.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Back
    </a>
    <h1>Transfer</h1>
    <span style="width:44px"></span>
  </header>

  <main id="main" class="content">
    <p style="font-size:13px; color:var(--color-text-secondary); margin:0 0 20px;">Step 1 of 2 — Details</p>

    <form>
      <div class="field">
        <label for="to">To</label>
        <select id="to">
          <option>J. Tan — •••• 2214 (saved payee)</option>
          <option>Savings Account •••• 9931 (my account)</option>
          <option>Add a new payee…</option>
        </select>
      </div>

      <div class="field">
        <label for="amount">Amount</label>
        <input id="amount" type="text" inputmode="decimal" value="150.00" aria-describedby="amount-hint">
        <p id="amount-hint" class="hint">Daily transfer limit: $5,000.00 remaining</p>
      </div>

      <div class="field">
        <label for="note">Note (optional)</label>
        <input id="note" type="text" placeholder="e.g. Rent, dinner split">
      </div>

      <a class="btn btn-primary" href="transfer-confirm.html">Review transfer</a>
    </form>
  </main>

  <nav class="bottom-nav" aria-label="Primary">
    <a class="nav-item" href="home.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      Home
    </a>
    <a class="nav-item active" href="transfer-details.html" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 7h13M7 7l4-4M7 7l4 4M17 17H4m13 0l-4 4m4-4l-4-4"/></svg>
      Transfer
    </a>
    <a class="nav-item" href="transactions.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      Activity
    </a>
    <a class="nav-item" href="account.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      Account
    </a>
  </nav>
</div>
</body>
</html>
