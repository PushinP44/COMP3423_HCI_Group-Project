<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transfer — Error state, edge case (Feature 2 + 4)</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a href="#main" class="skip-link">Skip to main content</a>
<div class="phone-frame">
  <div class="status-bar"><span>9:41</span><span>●●●●  Wi-Fi  100%</span></div>
  <header class="app-header"><h1>&nbsp;</h1></header>

  <main id="main" class="content">
    <div class="result-state" role="alert">
      <div class="result-icon error" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
      </div>
      <h2>Transfer didn't go through</h2>
      <p>We couldn't reach the network to complete this transfer. Your money has <strong>not</strong> been sent — no funds were deducted.</p>
      <a class="btn btn-primary" href="transfer-confirm.html" style="width:260px;">Try again</a>
      <a class="btn btn-secondary" href="home.html" style="width:260px;">Cancel</a>
    </div>
  </main>
</div>
</body>
</html>
